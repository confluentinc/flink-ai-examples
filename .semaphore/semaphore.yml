version: v1.0
name: build
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

auto_cancel:
  running:
    when: "branch != 'main'"

execution_time_limit:
  hours: 1

queue:
  - when: "branch != 'main'"
    processing: parallel

blocks:
  - name: "Build and Test"
    dependencies: []
    task:
      env_vars:
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=.m2"
      prologue:
        commands:
          - sem-version java 21
          - checkout
      jobs:
        - name: "build"
          commands:
            - cache restore
            #- ./mvnw clean package. Disable until 2.2 is released for used
            - cache store